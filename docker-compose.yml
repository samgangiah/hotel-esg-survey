services:
  phs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phs-app
    restart: unless-stopped
    depends_on:
      phs-db:
        condition: service_healthy
    networks:
      - tunnel-network
    volumes:
      # Respondent file uploads (energy bills, EPC, machine photos).
      # Host folder must be chowned to 1001:1001 (the `nextjs` container user)
      # so the app can write. Created during deploy.
      - /opt/vps/data/phs-files:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://esg:${POSTGRES_PASSWORD:-changeme}@phs-db:5432/esg?schema=public
      - SESSION_SIGNING_KEY=${SESSION_SIGNING_KEY:-dev-only-change-in-prod}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-${OPERATOR_EMAIL:-samendran@gmail.com}}
      - OPERATOR_EMAIL=${OPERATOR_EMAIL:-${PLATFORM_ADMIN_EMAIL:-samendran@gmail.com}}
      - APP_URL=${APP_URL:-https://phs.digitalstorm.cloud}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/uploads}
      - CRON_SECRET=${CRON_SECRET:-}

  phs-db:
    image: postgres:16-alpine
    container_name: phs-db
    restart: unless-stopped
    networks:
      - tunnel-network
    environment:
      - POSTGRES_USER=esg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=esg
    volumes:
      - esg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg -d esg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  esg-db-data:
    name: esg-db-data

networks:
  tunnel-network:
    external: true
